# OptionsPaye Configuration File
# API URLs for market data

# Yahoo Finance API URL for NIFTY 50 data
yahoo_finance_nifty_url=https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI

# NSE India API URL (alternative)
nse_india_url=https://www.nseindia.com/api/allIndices

# Fallback NIFTY price (used when APIs fail)
fallback_nifty_price=24350.75

# Price validation range
min_nifty_price=15000
max_nifty_price=30000

# ---- Strategy Studio ----
# Contract lot sizes change via NSE circulars; verify before relying on results
nifty_lot_size=65
banknifty_lot_size=30
# Simulator cost model
cost_per_order=20
slippage_pct=0.5
short_margin_pct=12
risk_free_rate=0.065
iv_multiplier=1.10
# Seconds between automatic paper-deployment updates
paper_tick_seconds=900
